AWSTemplateFormatVersion: '2010-09-09'
Description: '( SO9610 ) Networking exports for Codex - creates a VPC or reuses an existing VPC and two public subnets'

Parameters:
  ExistingVpcId:
    Type: String
    Default: ''
    Description: Existing VPC to export instead of creating networking resources

  ExistingPublicSubnet1:
    Type: String
    Default: ''
    Description: First existing public subnet, in a different AZ from ExistingPublicSubnet2

  ExistingPublicSubnet2:
    Type: String
    Default: ''
    Description: Second existing public subnet, in a different AZ from ExistingPublicSubnet1

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for VPC

  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for public subnet 1

  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for public subnet 2

Rules:
  ExistingNetworkParametersAreComplete:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::And:
                - Fn::Equals: [!Ref ExistingVpcId, '']
                - Fn::Equals: [!Ref ExistingPublicSubnet1, '']
                - Fn::Equals: [!Ref ExistingPublicSubnet2, '']
            - Fn::And:
                - Fn::Not: [Fn::Equals: [!Ref ExistingVpcId, '']]
                - Fn::Not: [Fn::Equals: [!Ref ExistingPublicSubnet1, '']]
                - Fn::Not: [Fn::Equals: [!Ref ExistingPublicSubnet2, '']]
        AssertDescription: Supply ExistingVpcId and both existing public subnets together, or leave all three blank

Conditions:
  CreateNetwork: !Equals [!Ref ExistingVpcId, '']

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Condition: CreateNetwork
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: codex-otel-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateNetwork
    Properties:
      Tags:
        - Key: Name
          Value: codex-otel-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateNetwork
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Condition: CreateNetwork
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W33
            reason: Public subnets intentionally assign public IPs for internet-facing ECS tasks and ALB nodes.
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: codex-otel-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreateNetwork
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W33
            reason: Public subnets intentionally assign public IPs for internet-facing ECS tasks and ALB nodes.
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: codex-otel-public-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: codex-otel-public-rt

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateNetwork
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W0
            reason: Default public route to internet gateway is required for internet-facing subnets.
      guard:
        SuppressedRules:
          - NO_UNRESTRICTED_ROUTE_TO_IGW: "Default public route 0.0.0.0/0 to internet gateway is required for public subnets; subnets are explicitly designated as public-facing."
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNetwork
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNetwork
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

Outputs:
  VpcId:
    Description: The ID of the VPC
    Value: !If [CreateNetwork, !Ref VPC, !Ref ExistingVpcId]
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  PublicSubnet1:
    Description: The ID of the public subnet 1
    Value: !If [CreateNetwork, !Ref PublicSubnet1, !Ref ExistingPublicSubnet1]
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet1"

  PublicSubnet2:
    Description: The ID of the public subnet 2
    Value: !If [CreateNetwork, !Ref PublicSubnet2, !Ref ExistingPublicSubnet2]
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet2"

  SubnetIds:
    Description: Comma-separated list of subnet IDs
    Value: !If
      - CreateNetwork
      - !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2]]
      - !Join [",", [!Ref ExistingPublicSubnet1, !Ref ExistingPublicSubnet2]]
    Export:
      Name: !Sub "${AWS::StackName}-SubnetIds"
