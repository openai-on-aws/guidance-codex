AWSTemplateFormatVersion: '2010-09-09'
Description: AWS resources used by the Portkey Hybrid gateway on Amazon EKS.

Parameters:
  MantleProjectId:
    Type: String
    Default: '*'
    AllowedPattern: '^(\*|proj_[A-Za-z0-9_-]+)$'
  MantleModelId:
    Type: String
    Default: openai.gpt-5.5
    AllowedValues: [openai.gpt-5.5]

Resources:
  GatewayLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireGatewayLogs
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      Tags:
        - Key: Application
          Value: guidance-codex-portkey

  GatewayManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Permissions attached to the Portkey EKS IRSA role by eksctl.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [s3:ListBucket, s3:GetBucketLocation]
            Resource: !GetAtt GatewayLogBucket.Arn
          - Effect: Allow
            Action: [s3:GetObject, s3:PutObject, s3:AbortMultipartUpload]
            Resource: !Sub '${GatewayLogBucket.Arn}/*'
          - Sid: InvokeApprovedModel
            Effect: Allow
            Action: [bedrock-mantle:CreateInference]
            Resource: !Sub 'arn:${AWS::Partition}:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:project/${MantleProjectId}'
            Condition:
              StringEquals:
                bedrock-mantle:Model: !Ref MantleModelId
          - Sid: ReadApprovedProjectResponses
            Effect: Allow
            Action:
              - bedrock-mantle:GetInference
              - bedrock-mantle:CancelInference
              - bedrock-mantle:GetProject
              - bedrock-mantle:ListModels
            Resource: !Sub 'arn:${AWS::Partition}:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:project/${MantleProjectId}'

Outputs:
  GatewayManagedPolicyArn:
    Value: !Ref GatewayManagedPolicy
  GatewayLogBucketName:
    Value: !Ref GatewayLogBucket
  MantleModelId:
    Value: !Ref MantleModelId
  RetainedResources:
    Value: !Sub 'S3 log bucket ${GatewayLogBucket} is retained when the stack is deleted.'
