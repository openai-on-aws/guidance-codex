<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="title desc">
  <title id="title">LiteLLM Bedrock Runtime model aliases</title>
  <desc id="desc">Three LiteLLM model aliases map to GPT-5.6 Bedrock Runtime model IDs.</desc>
  <style>
    .bg { fill: #ffffff; }
    .border { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
    .header { fill: #f6f8fa; }
    .title { fill: #1f2328; font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .subtitle { fill: #57606a; font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .heading { fill: #57606a; font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .04em; }
    .alias { fill: #0969da; font: 700 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .model { fill: #24292f; font: 500 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .runtime { fill: #1a7f37; font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .note { fill: #57606a; font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .line { stroke: #d8dee4; stroke-width: 1; }
  </style>
  <rect class="bg" width="1400" height="610" rx="16"/>
  <rect class="border" x="1" y="1" width="1398" height="608" rx="15"/>
  <text class="title" x="56" y="70">LiteLLM Runtime model aliases</text>
  <text class="subtitle" x="56" y="106">Configured in deployment/litellm/litellm_config.yaml</text>
  <rect class="header" x="40" y="146" width="1320" height="62" rx="8"/>
  <text class="heading" x="72" y="184">CODEX MODEL ALIAS</text>
  <text class="heading" x="402" y="184">BEDROCK RUNTIME MODEL ID</text>
  <text class="heading" x="1070" y="184">UPSTREAM</text>
  <line class="line" x1="40" y1="302" x2="1360" y2="302"/>
  <text class="alias" x="72" y="264">gpt-5.6-sol</text>
  <text class="model" x="402" y="264">openai/global.openai.gpt-5.6-sol</text>
  <text class="runtime" x="1070" y="264">Bedrock Runtime</text>
  <line class="line" x1="40" y1="397" x2="1360" y2="397"/>
  <text class="alias" x="72" y="359">gpt-5.6-terra</text>
  <text class="model" x="402" y="359">openai/global.openai.gpt-5.6-terra</text>
  <text class="runtime" x="1070" y="359">Bedrock Runtime</text>
  <line class="line" x1="40" y1="492" x2="1360" y2="492"/>
  <text class="alias" x="72" y="454">gpt-5.6-luna</text>
  <text class="model" x="402" y="454">openai/global.openai.gpt-5.6-luna</text>
  <text class="runtime" x="1070" y="454">Bedrock Runtime</text>
  <text class="note" x="56" y="552">Codex calls the stable aliases; LiteLLM forwards Responses API traffic to the Bedrock Runtime OpenAI-compatible endpoint.</text>
</svg>
